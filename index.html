<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C H NFC - Cartões e Placas Inteligentes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #1f1f1f, #0a0a0a);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid #00ff88;
        }
        header h1 {
            font-size: 2.2rem;
            color: #00ff88;
            margin-bottom: 5px;
        }
        header p {
            color: #b0b0b0;
            font-size: 1rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .card-product {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .product-img {
            width: 100%;
            height: 220px;
            background-color: #2a2a2a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 0.9rem;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .product-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #fff;
        }
        .product-desc {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 15px;
        }
        .price-box {
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .price-retail {
            font-size: 1.1rem;
            color: #ccc;
            text-decoration: line-through;
        }
        .price-current {
            font-size: 1.6rem;
            color: #00ff88;
            font-weight: bold;
        }
        .price-wholesale {
            font-size: 0.95rem;
            color: #ffaa00;
            margin-top: 5px;
        }
        .btn-whatsapp {
            display: block;
            width: 100%;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
